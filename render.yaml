services:
  - type: web
    name: clearsay-ai
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: clearsay-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: CLEARSAY_DATA_DIR
        value: /var/data/clearsay
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: PAYMENTS_REQUIRED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CLEARSAY_PRICE_CENTS
        value: "0"
      - key: CLEARSAY_CURRENCY
        value: usd
      - key: CLEARSAY_ACCESS_HOURS
        value: "24"
      - key: CLEARSAY_ACCESS_PRODUCT_NAME
        value: ClearSay Access Pass
      - key: CLEARSAY_ACCESS_SECRET
        sync: false
      - key: CLEARSAY_PUBLIC_URL
        sync: false
